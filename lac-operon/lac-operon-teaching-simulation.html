
<!DOCTYPE html>
<html>
<head>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#fff;padding:.6rem .9rem}
.ctrl-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}
.ccard{background:#FAFAFA;border:1.5px solid #BFBFBF;border-radius:7px;padding:8px 12px;display:flex;align-items:center;gap:12px}
.clabel{font-size:13px;font-weight:700;color:#191919;min-width:54px}
.tog-row{display:flex;align-items:center;gap:8px}
.ttrack{width:42px;height:23px;background:#484848;border-radius:12px;position:relative;cursor:pointer;flex-shrink:0;transition:background .2s}
.ttrack.on{background:#8C1D40}
.tknob{position:absolute;top:3px;left:3px;width:17px;height:17px;background:#fff;border-radius:50%;pointer-events:none;transition:transform .2s;border:1px solid rgba(0,0,0,.15)}
.ttrack.on .tknob{transform:translateX(19px)}
.tval{font-size:13px;font-weight:600;color:#191919}
.sec-title{font-size:12px;font-weight:700;color:#191919;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.gene-label{font-size:12px;font-weight:600;color:#484848;margin-bottom:3px;margin-top:8px}
.mgrid{display:grid;gap:4px;margin-bottom:3px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.mbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;padding:5px;font-size:12.5px;font-weight:600;text-align:center;line-height:1.3;cursor:pointer;border-radius:6px;border:2px solid #484848;background:#fff;color:#191919;transition:all .15s;-webkit-appearance:none;appearance:none}
.mbtn:hover{background:#F0F0F0}
.mbtn.sel-on{background:#FFC627!important;border-color:#8C1D40!important;color:#191919!important}
.mbtn.sel-off{background:#8C1D40!important;border-color:#191919!important;color:#fff!important}
.mbtn .sym{font-size:14px;font-weight:700;pointer-events:none}
.mbtn .dsc{font-size:10px;font-weight:400;pointer-events:none}
.scols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:3px}
.scol{display:flex;flex-direction:column;gap:4px}
.scol-hd{font-size:12px;font-weight:600;color:#484848;text-align:center}
.sim-section{margin:8px 0 6px}
.sim-section-title{font-size:12px;font-weight:700;color:#191919;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.sim-btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.run-btn{background:#8C1D40;border:2px solid #8C1D40;border-radius:6px;color:#fff;font-size:13px;font-weight:700;padding:8px 18px;cursor:pointer;display:flex;align-items:center;gap:5px;-webkit-appearance:none;appearance:none}
.run-btn:hover{background:#6b1530}
.stop-btn{background:#fff;border:2px solid #BFBFBF;border-radius:6px;color:#484848;font-size:13px;font-weight:600;padding:8px 15px;cursor:pointer;display:flex;align-items:center;gap:5px;-webkit-appearance:none;appearance:none;opacity:.35;pointer-events:none;transition:opacity .15s}
.stop-btn.vis{opacity:1!important;pointer-events:auto!important}
.speed-btn{background:#fff;border:2px solid #BFBFBF;border-radius:6px;color:#484848;font-size:13px;font-weight:600;padding:8px 15px;cursor:pointer;-webkit-appearance:none;appearance:none;transition:all .15s}
.speed-btn.active{background:#FFC627;border-color:#8C1D40;color:#191919;font-weight:700}
.xbtn{background:#0077a8;border:2px solid #005580;border-radius:6px;color:#fff;font-size:13px;font-weight:700;padding:8px 15px;cursor:pointer;-webkit-appearance:none;appearance:none;opacity:.35;pointer-events:none;transition:opacity .15s}
.xbtn.vis{opacity:1;pointer-events:auto}
.svg-wrap{background:#fff;border:1.5px solid #BFBFBF;border-radius:8px;overflow:hidden;margin-bottom:6px}
.outcome{align-items:center;gap:8px;padding:9px 14px;border-radius:6px;font-size:13px;font-weight:600;margin-bottom:7px;border:2px solid transparent;display:none}
.outcome.vis{display:flex}
.oc-on{background:#FFC627;color:#191919;border-color:#8C1D40}
.oc-off{background:#8C1D40;color:#fff;border-color:#191919}
.oc-partial{background:#484848;color:#fff;border-color:#191919}
.odot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.oc-on .odot{background:#191919}.oc-off .odot{background:rgba(255,255,255,.7)}.oc-partial .odot{background:#FFC627}
.steplog{font-size:12.5px;color:#191919;min-height:30px;padding:2px 0;line-height:1.5}
.prods{display:flex;gap:6px;flex-wrap:wrap;min-height:22px;margin-top:6px}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:16px;opacity:0;transform:translateY(4px);transition:opacity .4s,transform .4s}
.pill.show{opacity:1;transform:translateY(0)}
.pill-on{background:#FFC627;color:#191919;border:1px solid #8C1D40}
.pill-off{background:#8C1D40;color:#fff}
.epanel{background:#FAFAFA;border:1.5px solid #BFBFBF;border-radius:8px;padding:13px 16px;margin-top:9px;display:none}
.epanel.vis{display:block}
.etitle{font-size:14px;font-weight:700;color:#8C1D40;margin-bottom:7px}
.ebody{font-size:12.5px;color:#191919;line-height:1.65}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:16px}
.tm{background:#8C1D40;color:#fff}.tg{background:#FFC627;color:#191919;border:1px solid #8C1D40}.tn{background:#78BE20;color:#191919}.ty{background:#484848;color:#fff}
@keyframes popIn{0%{transform:scale(0.4);opacity:0}80%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="ctrl-row">
  <div class="ccard"><div class="clabel">Lactose</div><div class="tog-row"><div class="ttrack" id="tl"><div class="tknob"></div></div><span class="tval" id="tlv">Absent</span></div></div>
  <div class="ccard"><div class="clabel">Glucose</div><div class="tog-row"><div class="ttrack on" id="tg"><div class="tknob"></div></div><span class="tval" id="tgv">Present</span></div></div>
</div>
<div class="sec-title">Mutations — select one allele per gene</div>
<div class="gene-label">lacI — repressor protein</div>
<div class="mgrid g3">
  <button class="mbtn sel-on" id="bi-plus"><span class="sym">I<sup>+</sup></span><span class="dsc">normal repressor</span></button>
  <button class="mbtn" id="bi-minus"><span class="sym">I<sup>−</sup></span><span class="dsc">cannot bind operator</span></button>
  <button class="mbtn" id="bi-s"><span class="sym">I<sup>s</sup></span><span class="dsc">super-repressor</span></button>
</div>
<div class="gene-label">lacP — promoter</div>
<div class="mgrid g2">
  <button class="mbtn sel-on" id="bp-plus"><span class="sym">P<sup>+</sup></span><span class="dsc">normal promoter</span></button>
  <button class="mbtn" id="bp-minus"><span class="sym">P<sup>−</sup></span><span class="dsc">mutated promoter</span></button>
</div>
<div class="gene-label">lacO — operator</div>
<div class="mgrid g2">
  <button class="mbtn sel-on" id="bo-plus"><span class="sym">O<sup>+</sup></span><span class="dsc">normal operator</span></button>
  <button class="mbtn" id="bo-c"><span class="sym">O<sup>c</sup></span><span class="dsc">mutated operator</span></button>
</div>
<div class="gene-label">Structural genes</div>
<div class="scols">
  <div class="scol"><div class="scol-hd">lacZ</div>
    <button class="mbtn sel-on" id="bz-plus"><span class="sym">Z<sup>+</sup></span><span class="dsc">β-gal OK</span></button>
    <button class="mbtn" id="bz-minus"><span class="sym">Z<sup>−</sup></span><span class="dsc">no β-gal</span></button>
  </div>
  <div class="scol"><div class="scol-hd">lacY</div>
    <button class="mbtn sel-on" id="by-plus"><span class="sym">Y<sup>+</sup></span><span class="dsc">permease OK</span></button>
    <button class="mbtn" id="by-minus"><span class="sym">Y<sup>−</sup></span><span class="dsc">no permease</span></button>
  </div>
  <div class="scol"><div class="scol-hd">lacA</div>
    <button class="mbtn sel-on" id="ba-plus"><span class="sym">A<sup>+</sup></span><span class="dsc">acetylase OK</span></button>
    <button class="mbtn" id="ba-minus"><span class="sym">A<sup>−</sup></span><span class="dsc">minimal effect</span></button>
  </div>
</div>
<div class="sim-section">
  <div class="sim-section-title">Simulation Controls</div>
  <div class="sim-btns">
    <button class="run-btn" id="runBtn"><svg width="11" height="11" viewBox="0 0 13 13"><polygon points="2,1 12,6.5 2,12" fill="white"/></svg> Run</button>
    <button class="stop-btn" id="stopBtn">⏹ Stop</button>
    <button class="speed-btn" id="speedBtn">🐢 Slower</button>
    <button class="xbtn" id="xbtn">Explain ↗</button>
  </div>
</div>
<div class="svg-wrap"><svg id="oSvg" width="100%" viewBox="0 0 1680 875" style="display:block"></svg></div>
<div id="outcome" class="outcome"><div class="odot"></div><span id="otxt"></span></div>
<div class="steplog" id="slog"></div>
<div class="prods" id="prods"></div>
<div class="epanel" id="epanel"><div class="etitle" id="etitle"></div><div class="ebody" id="ebody"></div><div class="tags" id="etags"></div></div>

<script>
(function(){
var ST={lac:false,glc:true,i:'plus',p:'plus',o:'plus',z:'plus',y:'plus',a:'plus'};
var GRP={i:['plus','minus','s'],p:['plus','minus'],o:['plus','c'],z:['plus','minus'],y:['plus','minus'],a:['plus','minus']};
var OFF={i:{minus:1,s:1},p:{minus:1},o:{},z:{minus:1},y:{minus:1},a:{minus:1}};
var stopToken=0,rafId=null,SPEED=1;
var BLU={f:'#006B99',s:'#004d6e',t:'#fff'};
var GLD={f:'#FFC627',s:'#8C1D40',t:'#191919'};
var MRN={f:'#8C1D40',s:'#5a1228',t:'#fff'};
var REP_F='#D8D8D8',REP_S='#999';
var CAP_ON={f:'#78BE20',s:'#3a6010'},CAP_OFF={f:'#C0C0C0',s:'#888'};
var CAMP_ON={f:'#FFC627',s:'#8C1D40'},CAMP_OFF={f:'#E8E8E8',s:'#BFBFBF'};
var POL_F='#A855C8',POL_S='#7B2D8B',POL_T='#fff';
var POL_OFF_F='#D0C8D8',POL_OFF_S='#9988a8',POL_OFF_T='#555';
var S=1.75;
var DY=350,DH=38,xCAP=185,xP=244,RX=300,RY=200;
var CLAMP=110,ALLO_X=580,CAP_CY=90,CAP_DOCK=239,BADGE_CX=710;
var SUB_A=DY+DH+16,SUB_B=DY+DH+32;
var SR=[SUB_A,SUB_B,SUB_A,SUB_B,SUB_A,SUB_B,SUB_A,SUB_B];
var MRNA_X1=318,MRNA_X2=612,MRNA_Y=DY+DH+54;
var MRNA_LEN=(MRNA_X2-MRNA_X1)*S,CYCLE_MS=3000;

/* Is the super-repressor + lactose case active? */
function isIsLac(){return ST.i==='s'&&ST.lac&&ST.y!=='minus';}

function stopAll(){stopToken++;if(rafId){cancelAnimationFrame(rafId);rafId=null;}document.getElementById('stopBtn').classList.remove('vis');}
function W(ms,fn){var tok=stopToken;setTimeout(function(){if(stopToken===tok)fn();},ms*SPEED);}
function tog(w){if(w==='lac'){ST.lac=!ST.lac;document.getElementById('tl').classList.toggle('on',ST.lac);document.getElementById('tlv').textContent=ST.lac?'Present':'Absent';}else{ST.glc=!ST.glc;document.getElementById('tg').classList.toggle('on',ST.glc);document.getElementById('tgv').textContent=ST.glc?'Present':'Absent';}reset();}
function pick(g,a){ST[g]=a;var io=OFF[g]&&OFF[g][a];GRP[g].forEach(function(v){var b=document.getElementById('b'+g+'-'+v);if(!b)return;b.classList.remove('sel-on','sel-off');if(v===a)b.classList.add(io?'sel-off':'sel-on');});reset();}
function reset(){stopAll();['xbtn','epanel'].forEach(function(id){document.getElementById(id).classList.remove('vis');});document.getElementById('outcome').classList.remove('vis','oc-on','oc-off','oc-partial');document.getElementById('slog').textContent='';document.getElementById('prods').innerHTML='';drawBase();}
function calc(){
  var lac=ST.lac,glc=ST.glc,i=ST.i,p=ST.p,o=ST.o;
  var li=lac&&ST.y!=='minus',rm=i!=='minus',ind=rm&&i!=='s'&&li;
  var of=o==='c'||!rm||ind,rb=!of,cb=!glc&&p!=='minus',pb=p!=='minus'&&of;
  var lv=!pb?'off':!glc?'on':'partial';
  var pk;if(!rm)pk='abs';else if(i==='s')pk='def';else if(ind)pk='bnd';else if(lac&&ST.y==='minus')pk='eym';else pk='emp';
  return{rb,cb,pb,lv,rm,ind,pk,zF:ST.z==='plus',yF:ST.y==='plus',aF:ST.a==='plus'};
}
var NS='http://www.w3.org/2000/svg';
function el(t,a){var e=document.createElementNS(NS,t);if(a)Object.keys(a).forEach(function(k){e.setAttribute(k,a[k]);});return e;}
function T(x,y,s,fs,fw,c,a){var t=el('text',{x:x*S,y:y*S,'font-size':(fs||13)*S,'font-weight':fw||400,fill:c||'#191919','text-anchor':a||'middle','dominant-baseline':'central','font-family':'system-ui,sans-serif'});t.textContent=s;return t;}
function Rx(x,y,w,h,r,col,sw){return el('rect',{x:x*S,y:y*S,width:w*S,height:h*S,rx:(r||5)*S,fill:col.f,stroke:col.s,'stroke-width':((sw||2)*S)});}
function Ln(x1,y1,x2,y2,s,sw,da,mk){var a={x1:x1*S,y1:y1*S,x2:x2*S,y2:y2*S,stroke:s,'stroke-width':((sw||1.5)*S)};if(da)a['stroke-dasharray']=da;if(mk)a['marker-end']=mk;return el('line',a);}
function El(cx,cy,rx,ry,f,s,sw){return el('ellipse',{cx:cx*S,cy:cy*S,rx:rx*S,ry:ry*S,fill:f,stroke:s,'stroke-width':((sw||2)*S)});}
function Ci(cx,cy,r,f,s,sw){return el('circle',{cx:cx*S,cy:cy*S,r:r*S,fill:f,stroke:s,'stroke-width':((sw||2)*S)});}
function Pt(d,f,s,sw){return el('path',{d:d,fill:f||'none',stroke:s,'stroke-width':((sw||2)*S),'stroke-linecap':'round','stroke-linejoin':'round'});}
function hp(cx,cy,r){var p=[];for(var k=0;k<6;k++){var ang=Math.PI/3*k-Math.PI/6;p.push((cx+r*Math.cos(ang)).toFixed(1)+','+(cy+r*Math.sin(ang)).toFixed(1));}return p.join(' ');}
function addDefs(svg){var d=el('defs',{});var m=el('marker',{id:'arr',viewBox:'0 0 10 10',refX:'8',refY:'5',markerWidth:'7',markerHeight:'7',orient:'auto-start-reverse'});m.appendChild(el('path',{d:'M2 1L8 5L2 9',fill:'none',stroke:'context-stroke','stroke-width':'1.5','stroke-linecap':'round'}));d.appendChild(m);svg.appendChild(d);}
function rm(e){if(e&&e.parentNode)e.parentNode.removeChild(e);}
function fi(g,d){g.style.transition='none';g.style.opacity='0';void g.offsetHeight;g.style.transition='opacity '+(d*SPEED)+'s ease';g.style.opacity='1';}
function fifo(g,inD,holdMs,outD){fi(g,inD);W(inD*1000+holdMs,function(){if(!g.parentNode)return;g.style.transition='opacity '+(outD*SPEED)+'s ease';g.style.opacity='0';W(outD*1000,function(){rm(g);});});}
function sy(g,f,t,d,cb){g.style.transition='none';g.style.transform='translateY('+f+'px)';void g.offsetHeight;g.style.transition='transform '+(d*SPEED)+'s ease-in-out';g.style.transform='translateY('+t+'px)';if(cb)W(d*1000,cb);}
function fsi(g,fy,ty,d,cb){g.style.transition='none';g.style.opacity='0';g.style.transform='translateY('+fy+'px)';void g.offsetHeight;var ds=(d*SPEED)+'s';g.style.transition='opacity '+ds+' ease, transform '+ds+' ease-in-out';g.style.opacity='1';g.style.transform='translateY('+ty+'px)';if(cb)W(d*1000,cb);}

var RG=[
  {x:14, w:72, lbl:'lacI', sub:'repressor gene', col:BLU},
  {x:92, w:32, lbl:'Pᵢ',  sub:'lacI prom.',      col:GLD},
  {x:130,w:76, lbl:'CAP', sub:'CAP binding site', col:GLD},
  {x:212,w:46, lbl:'P',   sub:'promoter',         col:GLD},
  {x:264,w:48, lbl:'O',   sub:'operator',         col:GLD},
  {x:318,w:100,lbl:'lacZ',sub:'β-galactosidase',  col:BLU},
  {x:424,w:90, lbl:'lacY',sub:'permease',         col:BLU},
  {x:520,w:90, lbl:'lacA',sub:'transacetylase',   col:BLU}
];
function mutLbl(idx){
  if(idx===0){if(ST.i==='minus')return{lbl:'lacI⁻',sub:'mutated repressor'};if(ST.i==='s')return{lbl:'lacIˢ',sub:'super-repr.'};}
  if(idx===3&&ST.p==='minus')return{lbl:'P⁻',sub:'mutated promoter'};
  if(idx===4&&ST.o==='c')return{lbl:'Oᶜ',sub:'always open'};
  if(idx===5&&ST.z==='minus')return{lbl:'lacZ⁻',sub:'no β-gal'};
  if(idx===6&&ST.y==='minus')return{lbl:'lacY⁻',sub:'no permease'};
  if(idx===7&&ST.a==='minus')return{lbl:'lacA⁻',sub:'no acetylase'};
  return null;
}
function drawBase(){
  var svg=document.getElementById('oSvg');while(svg.firstChild)svg.removeChild(svg.firstChild);addDefs(svg);
  svg.appendChild(Ln(14,DY+DH/2,622,DY+DH/2,'#191919','3'));
  RG.forEach(function(r,idx){var m=mutLbl(idx),lbl=m?m.lbl:r.lbl,sub=m?m.sub:r.sub;svg.appendChild(Rx(r.x,DY,r.w,DH,5,r.col));svg.appendChild(T(r.x+r.w/2,DY+19,lbl,14,700,r.col.t));svg.appendChild(T(r.x+r.w/2,SR[idx],sub,10,400,'#191919'));});
  svg.appendChild(T(955,488,'© 2026 Jessica Ebie',9,400,'#191919','end'));
}
function drawBox(svg,idx,lbl,col){var r=RG[idx];svg.appendChild(Rx(r.x,DY,r.w,DH,5,col));svg.appendChild(T(r.x+r.w/2,DY+19,lbl,14,700,col.t));}

function repBodyMis(g){
  g.appendChild(el('path',{d:'M '+(RX-20)*S+' '+(RY-2)*S+' C '+(RX-32)*S+' '+(RY-28)*S+' '+(RX-8)*S+' '+(RY-38)*S+' '+RX*S+' '+(RY-22)*S+' C '+(RX+16)*S+' '+(RY-36)*S+' '+(RX+36)*S+' '+(RY-20)*S+' '+(RX+30)*S+' '+RY*S+' C '+(RX+40)*S+' '+(RY+18)*S+' '+(RX+20)*S+' '+(RY+36)*S+' '+RX*S+' '+(RY+26)*S+' C '+(RX-20)*S+' '+(RY+38)*S+' '+(RX-36)*S+' '+(RY+20)*S+' '+(RX-20)*S+' '+(RY-2)*S+' Z',fill:'#E8E8E8',stroke:'#999','stroke-width':2*S,'stroke-dasharray':(4*S)+' '+(3*S)}));
  var bx=RX+26,by=RY-22;g.appendChild(el('circle',{cx:bx*S,cy:by*S,r:9*S,fill:'#FCEBEB',stroke:'#8C1D40','stroke-width':1.5*S}));g.appendChild(Ln(bx-5,by-5,bx+5,by+5,'#8C1D40','2'));g.appendChild(Ln(bx+5,by-5,bx-5,by+5,'#8C1D40','2'));
  g.appendChild(T(RX,RY+8,'I⁻ repressor',11,700,'#444','middle'));
}

/* repBody: draws repressor body only. Does NOT include Iˢ+lactose extras.
   Those are added separately into rG after clamping completes. */
function repBody(g,pk){
  g.appendChild(El(RX-13,RY-8,26,28,REP_F,REP_S,2));
  g.appendChild(El(RX+12,RY+10,24,26,REP_F,REP_S,2));
  g.appendChild(Pt('M '+(RX-16)*S+' '+(RY+32)*S+' Q '+(RX*S)+' '+(RY+40)*S+' '+(RX+16)*S+' '+(RY+32)*S,'none',REP_S,3));
  g.appendChild(T(RX,RY,ST.i==='s'?'Iˢ repressor':'Repressor',12,700,'#444','middle'));
  var px=RX+32,py=RY;
  if(pk==='emp'||pk==='eym'){g.appendChild(el('polygon',{points:hp(px*S,py*S,13*S),fill:'#F5F0E8',stroke:'#8C1D40','stroke-width':2*S,'stroke-dasharray':(3*S)+' '+(2*S)}));g.appendChild(T(px,py,'?',11,700,'#8C1D40'));}
  else if(pk==='bnd'){g.appendChild(el('polygon',{points:hp(px*S,py*S,13*S),fill:'#FF7F32',stroke:'#8B3a00','stroke-width':2*S}));}
  else if(pk==='def'){g.appendChild(Pt('M '+(RX+24)*S+' '+(RY-12)*S+' L '+(RX+36)*S+' '+(RY-4)*S+' L '+(RX+28)*S+' '+RY*S+' L '+(RX+38)*S+' '+(RY+8)*S+' L '+(RX+24)*S+' '+(RY+12)*S,'none','#8C1D40',3));}
}

/* Add Iˢ+lactose extras INTO an existing group (rG) that is already
   positioned at translateY(CLAMP*S). Coords are in original space (RX,RY)
   so they render relative to the repressor which is also at RX,RY. */
function addIsLacOverlay(g){
  var ax=RX+80, ay=RY; /* allolactose sits 80 units right of repressor centre */
  g.appendChild(el('polygon',{points:hp(ax*S,ay*S,13*S),fill:'#FF7F32',stroke:'#8B3a00','stroke-width':2*S}));
